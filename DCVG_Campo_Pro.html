<style>
:root{--bg:#070b16;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.11);--bd:rgba(255,255,255,.12);--tx:#eef3ff;--mu:#8fa0c4;--ac:#38d5ff;--ac2:#8b5cf6;--ok:#22d3a0;--bad:#ff5470;--am:#ffc84a;--inp:rgba(0,0,0,.28);--sh:0 10px 40px rgba(0,0,0,.35);color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef2fb;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.95);--bd:rgba(15,23,42,.10);--tx:#0b1226;--mu:#5b6b8c;--inp:rgba(15,23,42,.05);--sh:0 10px 40px rgba(30,50,100,.15);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;
background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.30),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(56,213,255,.22),transparent 60%);background-attachment:fixed}
#app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.brand{display:flex;gap:11px;align-items:center}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 22px rgba(56,213,255,.35)}
.brand b{font-size:18px;letter-spacing:.2px;display:block}.brand small{color:var(--mu);font-size:12px}
.ic{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-weight:600;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.am{color:var(--am)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--mu);display:flex;gap:8px;align-items:center}
.hero{background:linear-gradient(135deg,rgba(56,213,255,.18),rgba(139,92,246,.2));}
.hero .pk{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero .lb{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 6px;text-align:center}

button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:15px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--bd);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}

.btn.ok{background:linear-gradient(135deg,#22d3a0,#0ea5a4);color:#032a22;border:0}
.btn.am{background:linear-gradient(135deg,#ffc84a,#ff9a3c);color:#2b1700;border:0}
.btn.bad{background:rgba(255,84,112,.16);color:var(--bad);border:1px solid rgba(255,84,112,.4)}
.btn.sm{width:auto;padding:10px 14px;font-size:14px;border-radius:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts .btn{flex-direction:column;gap:5px;padding:14px 6px;font-size:13.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;font:inherit;font-size:19px;padding:12px 13px;border-radius:13px;border:1.5px solid var(--bd);background:var(--inp);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(56,213,255,.16)}
input.t{font-size:16px}textarea{font-size:15px;resize:vertical}
.row{display:flex;gap:8px;align-items:stretch}.row>*:first-child{flex:1}
.hint{font-size:12px;color:var(--mu);margin-top:5px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.sw:first-of-type{border-top:0}.sw span{font-size:14px}.sw small{display:block;color:var(--mu);font-size:12px}
.tg{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--inp);border:1.5px solid var(--bd);position:relative;padding:0;flex:none;box-shadow:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:.2s}
.tg:checked{background:var(--ok);border-color:var(--ok)}.tg:checked:after{left:25px;background:#fff}
.pt{display:flex;gap:11px;padding:11px;border-radius:16px;background:var(--card);border:1px solid var(--bd);margin-bottom:8px;position:relative;overflow:hidden;cursor:pointer}
.pt:active{background:var(--card2)}.pt:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pt .m{flex:1;min-width:0;padding-left:6px}.pt .k{font-weight:800;font-size:17px}.pt .d{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .tag{font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--c);text-transform:uppercase}
.pt .dst{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}.pt .dst span{white-space:nowrap}.pt .dst i{font-style:normal;color:var(--mu);font-weight:600}
.bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.bd .chip{font-size:11.5px;padding:3px 8px}.acg{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 3px;border-radius:99px;border:2px solid #fff}.acg svg{width:17px;height:17px;flex:none;display:block}
.th{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--bd);background:var(--inp);display:grid;place-items:center;color:var(--mu);font-size:11px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs>div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px;padding:6px;border-radius:24px;background:var(--card2);border:1px solid var(--bd);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--sh)}
.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:18px;font-size:11px;font-weight:700;color:var(--mu)}
.tabs button.on{background:linear-gradient(135deg,rgba(56,213,255,.25),rgba(139,92,246,.3));color:var(--tx)}
.view{display:none;animation:in .25s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);background-image:radial-gradient(800px 500px at 90% -10%,rgba(139,92,246,.28),transparent 60%);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sh-h{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--bd)}
.sh-h b{font-size:18px;flex:1}.sh-b{flex:1;overflow:auto;padding:6px 14px 18px;max-width:720px;width:100%;margin:auto}
.sh-f{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sh-f>div{max-width:720px;margin:auto}
.x{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;border:1px solid var(--bd);flex:none}
.pm{width:56px;border-radius:13px;background:var(--card2);font-weight:800;font-size:20px;border:1.5px solid var(--bd)}
.qk{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.qk button,.qc button{background:var(--card2);border:1px solid var(--bd);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:700}
.qc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.qc .vcx{width:38px;height:38px;padding:0;display:grid;place-items:center;margin-left:auto}.vcx svg{width:18px;height:18px;transition:transform .2s}.vcx[aria-expanded=true] svg{transform:rotate(180deg)}.vcp{margin-top:10px;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--bd)}.vw{display:inline-flex;align-items:stretch}.qc .vw .mc{border-radius:99px 0 0 99px;border-right-width:0}.qc .vw .vd{border-radius:0 99px 99px 0;padding:8px 11px;color:var(--mu)}.vca{display:flex;gap:8px;margin-top:12px;align-items:stretch}.vca input{flex:1;min-width:0;font-size:16px;padding:9px 12px}.vca .btn{width:auto;flex:none;padding:0 16px}.odo{border-color:var(--ac)}.odo .lb{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.odo .odv{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}.odo .odr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.odo .odx{font-size:13px;color:var(--mu)}.odo .odb{display:grid;gap:8px}.odo details{margin-top:12px;font-size:13px}.odo summary{color:var(--mu);cursor:pointer;font-weight:700}.odo .ods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.odo .ods label{font-size:11.5px;margin:0}.odo select{width:100%}#alo{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:22px}#alo.on{display:flex}#alo .alb{max-width:520px;width:100%;border:3px solid var(--bad);border-radius:22px;background:#1a0000;padding:22px;animation:alp 1s infinite alternate}@keyframes alp{from{box-shadow:0 0 0 0 rgba(255,60,60,0)}to{box-shadow:0 0 38px 6px rgba(255,60,60,.65)}}#alo h2{margin:0 0 10px;color:var(--bad);font-size:24px;letter-spacing:.5px}#alo p{margin:0 0 16px;font-size:16.5px;line-height:1.5}#alo .btn{width:100%;margin-top:8px;font-size:16px;padding:14px}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.live div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 4px;text-align:center}
.live small{display:block;font-size:10.5px;color:var(--mu);letter-spacing:.5px}.live b{font-size:19px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.lb2{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.lb2.on{display:flex}.lb2 img{max-width:100%;max-height:100%}.lb2 button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:80;background:var(--card2);border:1px solid var(--bd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
table{border-collapse:collapse;font-size:12px;color:#000}
th{background:#1e293b;color:#e2e8f0;padding:7px 6px;font-size:10.5px}
td{border:1px solid #cbd5e1;padding:5px 6px;text-align:center;white-space:nowrap}
td.l{text-align:left}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:7px 0}.ck .ic{margin-top:1px}
.ck.ok{color:var(--ok)}.ck.am{color:var(--am)}.ck.bad{color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:28px 10px;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--inp);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tc{display:flex;flex-direction:column;gap:5px;align-items:flex-end}#app.wide{max-width:none}
.seg{display:flex;border-radius:13px;overflow:hidden;border:1.5px solid var(--bd);width:104px;flex:none}.seg button{flex:1;padding:0;font-weight:800;font-size:22px;background:var(--inp);color:var(--mu)}.seg button.on[data-l=A]{background:#00aa00;color:#fff}.seg button.on[data-l=C]{background:#00c3ca;color:#00282a}
.ac{display:flex;gap:7px;height:54px}.ac input{text-align:center;padding:6px;min-width:0}
.zb{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px}.zb button{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:8px 13px;font-weight:800}
.tw{overflow:auto;max-height:calc(100vh - 215px);border-radius:12px;border:1px solid var(--bd);background:#fff}.sp{position:relative}.tin{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---- Distancia real desde el punto anterior ----
   Método "waypoint": distancia geodésica entre las posiciones GPS promediadas de ambos puntos (el error común de ambas lecturas se cancela).
   Si entre ambos hubo una curva, se mide por los puntos intermedios del camino. Si el GPS no es confiable, se usa el odómetro (PK). */
const fm2=v=>v.toFixed(2).replace('.',',');
function distAnt(p,q){
 const H=(v,t)=>'<div class="dst"><i>Distancia al punto anterior:</i><span>'+v+'</span>'+(t?'<i>· '+t+'</i>':'')+'</div>';
 if(!q)return H('punto de partida','');
 const k1=$n(p.pk),k0=$n(q.pk),dk=(k1!=null&&k0!=null)?Math.round((k1-k0)*100)/100:null;
 const la1=$n(p.lat),lo1=$n(p.lon),la0=$n(q.lat),lo0=$n(q.lon),a1=$n(p.acc),a0=$n(q.acc);
 let g=null;
 if(la1!=null&&lo1!=null&&la0!=null&&lo0!=null){
  const ch=geoDist(la0,lo0,la1,lo1),m=E.mig,i0=q.mi,i1=p.mi;g=ch;
  if(m&&i0!=null&&i1!=null&&i1>i0&&i1<=m.length){let s=0,x=la0,y=lo0;for(let i=i0;i<i1;i++){s+=geoDist(x,y,m[i][0],m[i][1]);x=m[i][0];y=m[i][1]}s+=geoDist(x,y,la1,lo1);if(s>ch*1.03+0.5)g=s}}
 let d=null,src='';
 if(g!=null&&a1!=null&&a0!=null&&a1<=15&&a0<=15){
  d=g;src='GPS';
  // el GPS solo vale si concuerda con el odómetro (PK) y la distancia supera 2× su propio ruido: a pocos metros el GPS inventa distancias
  if(dk!=null&&(Math.abs(d-dk)>Math.max(4,0.25*Math.abs(dk))||d<2*Math.hypot(a1,a0))){d=dk;src='odómetro'}}
 else if(dk!=null){d=dk;src='odómetro'}
 else if(g!=null){d=g;src='GPS aprox.'}
 if(d==null)return H('sin datos','falta PK o GPS');
 return H(fm2(d)+' m',(src==='odómetro'||src==='GPS')?'':src);
}

const VOC_KEY='dcvg_vocab_v1',VOC_TOP=24,VOC_ROWS=3,VOC_MAX=200;

const q=i=>document.getElementById(i);
let WL=null,ON=false,HT=null,HP=null;
async function wl(){try{if(!navigator.wakeLock)return false;if(WL)return true;WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null;if(ON&&!document.hidden)setTimeout(wl,300)});return true}catch(e){WL=null;return false}}
function paint(){try{const o=(E&&E.odo)||null,d=o?(o.est==='fin'?(+o.total||0):(+o.dist||0)):0;
 q('pk_v').textContent=d>=1000?(d/1000).toFixed(2)+' km':Math.round(d)+' m';
 const a=FIX?Date.now()-FIX.t:null;
 q('pk_g').textContent=a==null?'GPS sin lectura':a>20000?'⚠ GPS sin lecturas hace '+Math.round(a/1000)+' s':'GPS ±'+FIX.acc+' m'}catch(e){}}
async function enter(){if(ON)return;
 const ok=await wl();
 if(!ok){try{toast('No se pudo mantener la pantalla encendida (revise el ahorro de batería o actualice el navegador). Modo bolsillo NO activado.',7500)}catch(e){}return}
 ON=true;p.classList.add('on');b.classList.remove('on');try{bgKeep(true)}catch(e){}paint()}
function exit(){if(!ON)return;ON=false;p.classList.remove('on');cancel();
 try{if(WL){const w=WL;WL=null;w.release()}}catch(e){}
 try{if(inspActiva())odoWL(true)}catch(e){}}
function cancel(){clearTimeout(HT);HT=null;HP=null;const f=q('pk_f');f.style.transition='height .2s';f.style.height='0'}
b.addEventListener('click',enter);
const u=q('pk_u');
u.addEventListener('pointerdown',e=>{if(HP!=null)return;HP=e.pointerId;const f=q('pk_f');f.style.transition='height 2s linear';f.style.height='100%';HT=setTimeout(()=>{HT=null;HP=null;exit()},2000);e.preventDefault()});
['pointerup','pointercancel','pointerleave'].forEach(n=>u.addEventListener(n,e=>{if(e.pointerId===HP)cancel()}));
['touchmove','touchstart','contextmenu','wheel'].forEach(n=>p.addEventListener(n,e=>{e.preventDefault()},{passive:false}));
document.addEventListener('visibilitychange',()=>{if(ON&&!document.hidden){wl();paint()}});
setInterval(()=>{try{
 if(ON){paint();if(!inspActiva()){exit();try{toast('Inspección finalizada: modo bolsillo desactivado',3500)}catch(e){}}}
 else b.classList.toggle('on',!!inspActiva())}catch(e){}},1000);
}catch(e){console.error('modo bolsillo',e)}})();
</script></body></html>
